{% extends "mainui.html" %}
{% load static %}
{% block title %}
    <title>Create Playlist</title>
{% endblock title %}

{% block csss %}
<style type="text/css">
    legend{
        font-size: 3rem;
        font-weight: 600;
        background: -webkit-linear-gradient(#191922,#17a2b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    input[type=text],input[type=text]:focus,
    .textarea,.textarea:focus{
        background-color: #101316;
        color: #fff;
    }
    input[type=text]:focus,.textarea:focus{
        border: 1px solid #17a2b8;
    }
    label{
        color: #97B4B4;
    }
    div{
        color: #97B4B4;
    }
</style>
{% endblock csss %}


{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="content-section">
            <form method="POST">
                {% csrf_token %}
                <fieldset class="form-group">
                    <legend class="border-bottom mb-4 main-t">Create Playlist</legend>
                    {{ form|crispy }}
                </fieldset>
                <div class="form-group">
                    <button class="btn btn-outline-danger" type="submit">
                        Create
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>



{% endblock content %}
