{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <link  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="text/css" href="{% static 'images/icon.ico' %}" type="image/icon">
    <link rel="stylesheet" type="text/css" href="{% static "css/styles.css" %}">
    <title>NxK Music</title>
    <style type="text/css">
      #landing-pd{
        background-image: url("{% static "images/andingbg.png" %}");
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
      }
      .getstarted a{
        position: relative;
        top: 300px;
        /*padding: 20px;*/
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 20%;
        background: transparent;
        color: #fff;
        font-weight: bolder;
        border: 2px solid #3b4452;
      }
      .getstarted a:hover{
        color:#b35967 ;
        background: transparent;
        border-color: #b35967;
      }
      .getstarted a:active{
        outline: none;
      }
    </style>
  </head>
  <body id="landing-pd">
    {% include "navbar.html" %}


    <div class="getstarted">
      <a href="{% url 'login' %}" class="btn">GET STARTED</a>
    </div>



    <script src="{% static "js/main.js" %}"></script>
    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>


  </body>
</html>
